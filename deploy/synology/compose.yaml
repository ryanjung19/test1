name: vassment-one

services:
  postgres:
    image: postgres:17-alpine
    container_name: vassment-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    secrets:
      - postgres_password
    volumes:
      - ${VASSMENT_DATA_ROOT:-/volume1/docker/vassment-one}/postgres:/var/lib/postgresql/data
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - internal

  schema-init:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: dbtools
    container_name: vassment-schema-init
    restart: "no"
    environment:
      DATABASE_URL_FILE: /run/secrets/database_url
    secrets:
      - database_url
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  app:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: app
    container_name: vassment-app
    restart: unless-stopped
    ports:
      - "${APP_BIND_ADDRESS:-0.0.0.0}:${APP_PORT:-3100}:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL_FILE: /run/secrets/database_url
      APP_URL: ${APP_URL:?APP_URL is required}
      DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-Asia/Seoul}
      ADMIN_PASSWORD_HASH_FILE: /run/secrets/admin_password_hash
      ADMIN_SESSION_SECRET_FILE: /run/secrets/admin_session_secret
      CUSTOMER_PORTAL_SECRET_FILE: /run/secrets/customer_portal_secret
      INTEGRATION_WEBHOOK_SECRET_FILE: /run/secrets/integration_webhook_secret
      AUTOMATION_SECRET_FILE: /run/secrets/automation_secret
      TOSS_CLIENT_KEY_FILE: /run/secrets/toss_client_key
      TOSS_SECRET_KEY_FILE: /run/secrets/toss_secret_key
      TOSS_LIVE_APPROVED: ${TOSS_LIVE_APPROVED:-false}
    secrets:
      - database_url
      - admin_password_hash
      - admin_session_secret
      - customer_portal_secret
      - integration_webhook_secret
      - automation_secret
      - toss_client_key
      - toss_secret_key
    depends_on:
      postgres:
        condition: service_healthy
      schema-init:
        condition: service_completed_successfully
    networks:
      - internal
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

networks:
  internal:
    name: vassment-one-internal

secrets:
  postgres_password:
    file: ${VASSMENT_SECRETS_ROOT:-/volume1/docker/vassment-one/secrets}/postgres_password
  database_url:
    file: ${VASSMENT_SECRETS_ROOT:-/volume1/docker/vassment-one/secrets}/database_url
  admin_password_hash:
    file: ${VASSMENT_SECRETS_ROOT:-/volume1/docker/vassment-one/secrets}/admin_password_hash
  admin_session_secret:
    file: ${VASSMENT_SECRETS_ROOT:-/volume1/docker/vassment-one/secrets}/admin_session_secret
  customer_portal_secret:
    file: ${VASSMENT_SECRETS_ROOT:-/volume1/docker/vassment-one/secrets}/customer_portal_secret
  integration_webhook_secret:
    file: ${VASSMENT_SECRETS_ROOT:-/volume1/docker/vassment-one/secrets}/integration_webhook_secret
  automation_secret:
    file: ${VASSMENT_SECRETS_ROOT:-/volume1/docker/vassment-one/secrets}/automation_secret
  toss_client_key:
    file: ${VASSMENT_SECRETS_ROOT:-/volume1/docker/vassment-one/secrets}/toss_client_key
  toss_secret_key:
    file: ${VASSMENT_SECRETS_ROOT:-/volume1/docker/vassment-one/secrets}/toss_secret_key
