name: CI

on:
  push:
    branches:
      - "feat/vassment-one-booking-v0.1"
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ADMIN_PASSWORD: ci-only-password
      ADMIN_SESSION_SECRET: ci-only-session-secret-change-in-production-123456
      INTEGRATION_WEBHOOK_SECRET: ci-only-integration-secret
      AUTOMATION_SECRET: ci-only-automation-secret
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.20.0"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
