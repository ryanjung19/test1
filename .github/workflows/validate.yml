name: Validate MEETSET V1

on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/meetset-v1]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Check required frontend files
        run: |
          test -f index.html
          test -f styles.css
          test -f app.js
          grep -q "MEETSET" index.html
